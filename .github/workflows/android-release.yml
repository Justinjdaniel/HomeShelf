name: Native Android APK Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release version tag (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-and-release-apk:
    name: Build & Publish Native Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle Wrapper Executable
        run: |
          cd android
          chmod +x gradlew || true

      - name: Build Android Release APK
        working-directory: ./android
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug --stacktrace
            cp app/build/outputs/apk/debug/app-debug.apk ../homeshelf-v1.0.0.apk
          else
            gradle assembleDebug --stacktrace
            cp app/build/outputs/apk/debug/app-debug.apk ../homeshelf-v1.0.0.apk
          fi

      - name: Upload APK as GitHub Actions Artifact
        uses: actions/upload-artifact@v4
        with:
          name: homeshelf-android-apk
          path: ./homeshelf-v1.0.0.apk
          if-no-files-found: error

      - name: Determine Tag Name
        id: vars
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ github.event.inputs.release_tag || 'v1.0.0' }}" >> $GITHUB_OUTPUT
          fi

      - name: Create or Update GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: HomeShelf Android Release ${{ steps.vars.outputs.tag }}
          body: |
            ### HomeShelf Native Android Offline-First Release 📱

            Automated native Android release build for commit `${{ github.sha }}`.

            #### Features:
            - **100% Offline Room SQLite**: Local-first inventory ledger with high-performance querying.
            - **CameraX + ML Kit**: Hardware-accelerated offline barcode and QR intake.
            - **Modern Material 3 Jetpack Compose UI**: Smooth animations with tactile pantry organization.

            #### Download & Install:
            1. Download `homeshelf-v1.0.0.apk` onto your Android device.
            2. Open the APK file to install (pre-signed for immediate side-loading).
          files: ./homeshelf-v1.0.0.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
